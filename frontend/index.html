<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title>GetForms — Open-Source Form Backend & Form-to-Email Service</title>
    <meta name="description" content="Modern, high-performance, open-source form backend and form-to-email service. Free self-hosted & managed cloud alternative to Formspree, Basin, and Formcarry with zero-config SQLite, multi-channel alerts, and modern spam protection." />
    <meta name="keywords" content="form backend, form to email, formspree alternative, formcarry alternative, formbee alternative, basin alternative, self-hosted forms, contact form API, open source form service, newsletter waitlist backend, turnstile, recaptcha, altcha" />
    <meta name="author" content="Lucky Yaduvanshi" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://getforms.codaipro.com/" />
    <meta property="og:title" content="GetForms — Modern Open-Source Form Backend" />
    <meta property="og:description" content="Add one action attribute to any HTML form and receive instant submissions. Free self-hosted and managed cloud alternative to Formspree." />
    <meta property="og:site_name" content="GetForms" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@LuckyYaduv61183" />
    <meta name="twitter:creator" content="@LuckyYaduv61183" />
    <meta name="twitter:title" content="GetForms — Modern Open-Source Form Backend" />
    <meta name="twitter:description" content="Open-source form-to-email and submission management engine. Self-host with SQLite or use free managed cloud." />

    <!-- Type: IBM Plex Sans (UI), Plex Serif (titles), Plex Mono (data).
         Preconnected and preloaded so the first paint is not blocked. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@600;700&display=swap"
    />

    <!-- Prevent flash of wrong theme on load -->
    <script>
      (function() {
        var stored = localStorage.getItem('getforms-theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (stored === 'dark' || (!stored && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
